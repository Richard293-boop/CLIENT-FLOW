<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClientFlow - AI Client-Ops for Freelancers</title>
    <meta
      name="description"
      content="ClientFlow handles routine client work automatically and escalates sensitive matters, so freelancers spend more time doing the work and less time managing clients."
    />
    <meta name="robots" content="index, follow" />
    <link rel="icon" type="image/png" href="/assets/aistudio/clientflow_logo_clean.png" />
    <link rel="canonical" href="https://[site URL]/" />

    <!-- Open Graph / Facebook / LinkedIn / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Client's Flow" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://[site URL]/" />
    <meta property="og:title" content="Client's Flow - AI Client-Ops for Freelancers" />
    <meta
      property="og:description"
      content="Stop chasing your clients. Keep doing the work. Client's Flow automates onboarding, routine questions, progress updates, reminders, and delivery."
    />
    <meta property="og:image" content="/assets/aistudio/clientflow_logo_clean.png" />
    <meta property="og:image:alt" content="Client's Flow - AI Client-Ops for Freelancers logo" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://[site URL]/" />
    <meta name="twitter:title" content="ClientFlow - AI Client-Ops for Freelancers" />
    <meta
      name="twitter:description"
      content="Stop chasing your clients. Keep doing the work. ClientFlow automates onboarding, routine questions, updates, and reminders."
    />
    <meta name="twitter:image" content="/assets/aistudio/clientflow_logo_clean.png" />

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Schema.org Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebApplication",
            "@id": "https://[site URL]/#app",
            "name": "ClientFlow",
            "url": "https://[site URL]/",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "All",
            "description": "AI client-ops tool for freelancers that handles routine client communication, reminders, and delivery handoffs.",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            }
          },
          {
            "@type": "FAQPage",
            "@id": "https://[site URL]/#faq",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "What is ClientFlow?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "ClientFlow is an AI client-ops tool built specifically for freelancers to handle routine onboarding, questions, progress updates, reminders, and delivery automatically."
                }
              },
              {
                "@type": "Question",
                "name": "When does it launch?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "We are currently onboarding early users in batches. The first group opens on [launch date]."
                }
              },
              {
                "@type": "Question",
                "name": "Is joining free?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes, joining the waitlist is 100% free and requires only an email address."
                }
              }
            ]
          }
        ]
      }
    </script>
  </head>
  <body class="bg-white text-slate-700 antialiased font-sans selection:bg-[#4DA3FF]/20 selection:text-slate-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
